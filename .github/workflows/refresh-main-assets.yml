name: Refresh main page assets
on:
  push:
    paths:
      - '.github/workflows/refresh-main-assets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update main page asset versions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="daily-phrase.js?v=20260914c"></script>'
          new='<script src="daily-phrase.js?v=20260917e"></script>\n<script src="owner-mode.js?v=20260917e"></script>'
          if old in s:
              s=s.replace(old,new,1)
          else:
              import re
              s=re.sub(r'<script src="daily-phrase\.js\?v=[^"]+"></script>(?:\s*<script src="owner-mode\.js\?v=[^"]+"></script>)?',new,s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache-busting update
        shell: bash
        run: |
          git config user.name 'slangify-kz'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh daily practice and owner panel on main page'
          git push
