name: Check Slangify
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/**'
      - '.github/workflows/check-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check learning and player behavior
        run: node --test tests/*.test.cjs
