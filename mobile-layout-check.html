<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Mobile layout check</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;font:14px system-ui;background:#ddd;color:#222}header{display:flex;align-items:center;gap:20px;margin-bottom:14px}button,select{font:inherit;padding:10px}iframe{border:1px solid #aaa;height:820px;display:block;background:white}.frames{display:flex;gap:20px;align-items:flex-start}.device{flex-shrink:0}h2{font-size:14px;margin:0 0 10px}</style></head><body><header><b>Mobile viewport check</b><label>Phone width <select id="width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="760">760 px</option></select></label></header><div class="frames"><section class="device"><h2>Live responsive view</h2><iframe id="phone" title="Phone preview" src="./index.html" style="width:390px"></iframe></section><section class="device"><h2>Small screen</h2><iframe id="small" title="Small phone preview" src="./index.html#dictionary" style="width:320px"></iframe></section></div><script>document.getElementById('width').addEventListener('change',e=>document.getElementById('phone').style.width=e.target.value+'px');</script></body></html>
